<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="권한별 화면 구조도: 누구나 볼 수 있는 화면, 로그인 사용자 화면, 동아리장 화면, 관리자 화면으로 나뉜다">
  <style>
    :root, svg {
      --bg:#FBFAFF; --card:#FFFFFF; --line:#E5E1F6; --chip:#EFECFC;
      --ink:#453A6E; --dim:#948DB3; --accent:#7C6BC4;
    }
    @media (prefers-color-scheme: dark) {
      :root, svg {
        --bg:#16152A; --card:#211F3B; --line:#322F56; --chip:#2C2950;
        --ink:#E8E5FA; --dim:#9A94C2; --accent:#A08FF2;
      }
    }
    .bg   { fill: var(--bg); }
    .col  { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .row  { fill: var(--chip); }
    .bar  { fill: var(--accent); }
    .hd   { fill: var(--ink); font-weight: 800; font-size: 14px; letter-spacing: -.02em; }
    .eb   { fill: var(--dim); font-size: 10px; font-weight: 700; letter-spacing: .12em; }
    .it   { fill: var(--ink); font-size: 12.5px; font-weight: 700; }
    text  { font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="400" rx="16"/>

  <!-- ── 누구나 ── -->
  <rect class="col" x="24" y="24" width="192" height="352" rx="16"/>
  <text class="eb" x="44" y="52">PUBLIC</text>
  <text class="hd" x="44" y="74">누구나</text>

  <rect class="row" x="40" y="92"  width="160" height="28" rx="8"/><rect class="bar" x="40" y="92"  width="3" height="28" rx="2"/>
  <text class="it" x="54" y="111">메인 · 곡선 캐러셀</text>
  <rect class="row" x="40" y="128" width="160" height="28" rx="8"/><rect class="bar" x="40" y="128" width="3" height="28" rx="2"/>
  <text class="it" x="54" y="147">아카이브 · 둘러보기</text>
  <rect class="row" x="40" y="164" width="160" height="28" rx="8"/><rect class="bar" x="40" y="164" width="3" height="28" rx="2"/>
  <text class="it" x="54" y="183">동아리 상세 · 타임라인</text>
  <rect class="row" x="40" y="200" width="160" height="28" rx="8"/><rect class="bar" x="40" y="200" width="3" height="28" rx="2"/>
  <text class="it" x="54" y="219">활동 글 상세</text>
  <rect class="row" x="40" y="236" width="160" height="28" rx="8"/><rect class="bar" x="40" y="236" width="3" height="28" rx="2"/>
  <text class="it" x="54" y="255">로그인 · 회원가입</text>
  <rect class="row" x="40" y="272" width="160" height="28" rx="8"/><rect class="bar" x="40" y="272" width="3" height="28" rx="2"/>
  <text class="it" x="54" y="291">이메일 인증 결과</text>

  <!-- ── 로그인 사용자 ── -->
  <rect class="col" x="240" y="24" width="192" height="352" rx="16"/>
  <text class="eb" x="260" y="52">MEMBER</text>
  <text class="hd" x="260" y="74">로그인 사용자</text>

  <rect class="row" x="256" y="92"  width="160" height="28" rx="8"/><rect class="bar" x="256" y="92"  width="3" height="28" rx="2"/>
  <text class="it" x="270" y="111">내 정보 · AI 키 등록</text>
  <rect class="row" x="256" y="128" width="160" height="28" rx="8"/><rect class="bar" x="256" y="128" width="3" height="28" rx="2"/>
  <text class="it" x="270" y="147">내 신청 현황 · 취소</text>
  <rect class="row" x="256" y="164" width="160" height="28" rx="8"/><rect class="bar" x="256" y="164" width="3" height="28" rx="2"/>
  <text class="it" x="270" y="183">가입 신청 모달</text>
  <rect class="row" x="256" y="200" width="160" height="28" rx="8"/><rect class="bar" x="256" y="200" width="3" height="28" rx="2"/>
  <text class="it" x="270" y="219">동아리 개설 신청</text>

  <!-- ── 동아리장 ── -->
  <rect class="col" x="456" y="24" width="192" height="352" rx="16"/>
  <text class="eb" x="476" y="52">LEADER</text>
  <text class="hd" x="476" y="74">동아리장</text>

  <rect class="row" x="472" y="92"  width="160" height="28" rx="8"/><rect class="bar" x="472" y="92"  width="3" height="28" rx="2"/>
  <text class="it" x="486" y="111">활동 글 작성 · AI</text>
  <rect class="row" x="472" y="128" width="160" height="28" rx="8"/><rect class="bar" x="472" y="128" width="3" height="28" rx="2"/>
  <text class="it" x="486" y="147">신청자 목록 · 승인</text>
  <rect class="row" x="472" y="164" width="160" height="28" rx="8"/><rect class="bar" x="472" y="164" width="3" height="28" rx="2"/>
  <text class="it" x="486" y="183">부원 관리 · 기수</text>
  <rect class="row" x="472" y="200" width="160" height="28" rx="8"/><rect class="bar" x="472" y="200" width="3" height="28" rx="2"/>
  <text class="it" x="486" y="219">가입폼 편집</text>
  <rect class="row" x="472" y="236" width="160" height="28" rx="8"/><rect class="bar" x="472" y="236" width="3" height="28" rx="2"/>
  <text class="it" x="486" y="255">탈퇴 요청 처리</text>
  <rect class="row" x="472" y="272" width="160" height="28" rx="8"/><rect class="bar" x="472" y="272" width="3" height="28" rx="2"/>
  <text class="it" x="486" y="291">동아리 정보 수정</text>
  <rect class="row" x="472" y="308" width="160" height="28" rx="8"/><rect class="bar" x="472" y="308" width="3" height="28" rx="2"/>
  <text class="it" x="486" y="327">동아리장 위임</text>

  <!-- ── 관리자 ── -->
  <rect class="col" x="672" y="24" width="192" height="352" rx="16"/>
  <text class="eb" x="692" y="52">ADMIN</text>
  <text class="hd" x="692" y="74">관리자</text>

  <rect class="row" x="688" y="92"  width="160" height="28" rx="8"/><rect class="bar" x="688" y="92"  width="3" height="28" rx="2"/>
  <text class="it" x="702" y="111">개설 신청 승인·거절</text>
  <rect class="row" x="688" y="128" width="160" height="28" rx="8"/><rect class="bar" x="688" y="128" width="3" height="28" rx="2"/>
  <text class="it" x="702" y="147">동아리 보관 전환</text>
  <rect class="row" x="688" y="164" width="160" height="28" rx="8"/><rect class="bar" x="688" y="164" width="3" height="28" rx="2"/>
  <text class="it" x="702" y="183">동아리장 강제 교체</text>
</svg>
