<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="AI 활동 글 초안 흐름: 메모와 사진, 결과보고서를 서버가 받아 프롬프트를 조립하고 AI Gateway를 호출해 제목·본문·태그 초안을 만든다. 메모와 PDF가 모두 없으면 초안을 만들지 않고, 게시는 동아리장이 직접 한다">
  <style>
    :root, svg {
      --bg:#FBFAFF; --card:#FFFFFF; --line:#E5E1F6; --chip:#EFECFC;
      --ink:#453A6E; --dim:#948DB3; --accent:#7C6BC4;
      --warnBg:#FBF0E4; --warnLine:#EDD6B8; --warnInk:#8A6633;
    }
    @media (prefers-color-scheme: dark) {
      :root, svg {
        --bg:#16152A; --card:#211F3B; --line:#322F56; --chip:#2C2950;
        --ink:#E8E5FA; --dim:#9A94C2; --accent:#A08FF2;
        --warnBg:#3A2E22; --warnLine:#57432C; --warnInk:#E7C48C;
      }
    }
    .bg   { fill: var(--bg); }
    .box  { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .hi   { fill: var(--chip); stroke: var(--accent); stroke-width: 1.5; }
    .warn { fill: var(--warnBg); stroke: var(--warnLine); stroke-width: 1.5; }
    .eb   { fill: var(--dim); font-size: 10px; font-weight: 700; letter-spacing: .12em; }
    .t    { fill: var(--ink); font-weight: 700; font-size: 14.5px; }
    .s    { fill: var(--dim); font-size: 12px; }
    .wt   { fill: var(--warnInk); font-weight: 700; font-size: 14.5px; }
    .ws   { fill: var(--warnInk); font-size: 12px; }
    .l    { fill: var(--dim); font-size: 11px; font-weight: 700; }
    .arrow{ stroke: var(--accent); stroke-width: 1.8; fill: none; }
    .dash { stroke: var(--warnLine); stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
    text  { font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; }
  </style>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--warnLine)"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="400" rx="16"/>

  <!-- 1. 재료 -->
  <rect class="box" x="24" y="52" width="186" height="108" rx="14"/>
  <text class="eb" x="44" y="78">INPUT</text>
  <text class="t"  x="44" y="102">재료</text>
  <text class="s"  x="44" y="124">메모 한 줄 · 행사 사진</text>
  <text class="s"  x="44" y="144">활동 결과보고서 PDF</text>

  <!-- 2. 서버 -->
  <rect class="box" x="246" y="52" width="186" height="108" rx="14"/>
  <text class="eb" x="266" y="78">SERVER</text>
  <text class="t"  x="266" y="102">전처리</text>
  <text class="s"  x="266" y="124">PDF → 텍스트 추출</text>
  <text class="s"  x="266" y="144">프롬프트 조립 · 개인 키</text>

  <!-- 3. 게이트웨이 -->
  <rect class="hi" x="468" y="52" width="186" height="108" rx="14"/>
  <text class="eb" x="488" y="78">GATEWAY</text>
  <text class="t"  x="488" y="102">명지전문대 AI</text>
  <text class="s"  x="488" y="124">claude-sonnet-5</text>
  <text class="s"  x="488" y="144">이미지 입력 지원 확인</text>

  <!-- 4. 초안 -->
  <rect class="box" x="690" y="52" width="186" height="108" rx="14"/>
  <text class="eb" x="710" y="78">DRAFT</text>
  <text class="t"  x="710" y="102">초안</text>
  <text class="s"  x="710" y="124">제목 · 본문 · 태그</text>
  <text class="s"  x="710" y="144">편집창에 채워진다</text>

  <path class="arrow" d="M210,106 L238,106" marker-end="url(#a2)"/>
  <path class="arrow" d="M432,106 L460,106" marker-end="url(#a2)"/>
  <path class="arrow" d="M654,106 L682,106" marker-end="url(#a2)"/>

  <!-- 가드 -->
  <rect class="warn" x="24" y="268" width="408" height="100" rx="14"/>
  <text class="eb" x="44" y="294" style="fill: var(--warnInk); opacity:.8">GUARD · 기획서 §7.2</text>
  <text class="wt" x="44" y="318">메모도 PDF도 없으면 초안을 만들지 않는다</text>
  <text class="ws" x="44" y="340">사진만으로 쓰면 AI는 “뜻깊은 시간이었습니다”를 지어낸다.</text>
  <text class="ws" x="44" y="358">422 MEMO_REQUIRED — 버그가 아니라 설계다.</text>

  <path class="dash" d="M339,160 L339,260" marker-end="url(#a3)"/>
  <text class="l" x="348" y="212" style="fill: var(--warnInk)">재료 부족</text>

  <!-- 사람 -->
  <rect class="box" x="468" y="268" width="408" height="100" rx="14"/>
  <text class="eb" x="488" y="294">HUMAN · 기획서 §7.3</text>
  <text class="t"  x="488" y="318">사람이 읽고 고쳐서 게시한다</text>
  <text class="s"  x="488" y="340">자동 게시 없음. 저자는 동아리장이고 책임도 사람에게 있다.</text>
  <text class="s"  x="488" y="358">게시된 글에 ‘AI 작성’ 배지를 붙이지 않는 이유다.</text>

  <path class="arrow" d="M783,160 L783,260" marker-end="url(#a2)"/>
  <text class="l" x="792" y="212">검수</text>
</svg>
