<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive — MJC Club Archive</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ═══ 팔레트 A (라이트) ═══ */
:root{
  --bg:#FBFAFF; --card:#FFFFFF; --line:#E5E1F6; --chip:#EFECFC;
  --ink:#453A6E; --dim:#948DB3; --accent:#7C6BC4; --onAccent:#FFFFFF;
  --shadow:rgba(97,80,160,.13);
  --c1:#CFC6F2; --c2:#EFC9E2; --c3:#C3DBF1; --c4:#F3D0BF; --c5:#CBE0C9;
  color-scheme: light;
}
/* ═══ 팔레트 D (다크) ═══ */
:root[data-theme="dark"]{
  --bg:#16152A; --card:#211F3B; --line:#322F56; --chip:#2C2950;
  --ink:#E8E5FA; --dim:#9A94C2; --accent:#A08FF2; --onAccent:#1A1830;
  --shadow:rgba(0,0,0,.45);
  --c1:#6E63B8; --c2:#9A6EA8; --c3:#5C82B4; --c4:#B08066; --c5:#6C9E78;
  color-scheme: dark;
}
:root{
  --hdr:64px;
  --row:36px;    /* 베이스라인 한 칸. 모든 블록 높이를 이 배수로 맞춰 가로줄을 정렬한다 */
  --colw:248px;  /* 목록 한 덩어리의 폭. 고정해야 세로줄이 맞는다 */
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Pretendard,system-ui,"Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s;
}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:8px}

/* ── 헤더 (메인과 동일) ── */
.hdr{
  position:sticky;top:0;z-index:500;height:var(--hdr);display:flex;align-items:center;
  gap:16px;padding:0 clamp(18px,3.5vw,42px);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.hdr .logo{font-size:15.5px;font-weight:800;letter-spacing:-.025em}
.hdr nav{display:flex;gap:18px;font-size:13.5px;color:var(--dim);margin-left:6px}
.hdr nav a{text-decoration:none;color:inherit}
.hdr nav a.on{color:var(--ink);font-weight:700}
.hdr .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:none;border-radius:10px;padding:9px 17px;font-size:13.5px;font-weight:700;
  background:var(--accent);color:var(--onAccent)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:600}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:9px}
.btn.icon{background:transparent;border:1.5px solid var(--line);color:var(--ink);
  width:36px;height:36px;padding:0;border-radius:10px;display:grid;place-items:center;font-size:15px}

/* ══════ 아카이브 ══════ */
.wrap{
  display:grid;grid-template-columns:minmax(260px,30%) 1fr;
  gap:clamp(28px,5vw,72px);
  padding:clamp(36px,6vh,70px) clamp(20px,4vw,56px) 110px;
  align-items:start;
}

/* 좌측 레일 — 스케치에서 비어 있던 자리 */
.rail{position:sticky;top:calc(var(--hdr) + 28px)}
.rail h1{
  margin:0 0 6px;font-size:clamp(38px,4.6vw,62px);font-weight:400;
  letter-spacing:-.02em;line-height:1;
}
.rail .sub{margin:0 0 30px;font-size:13px;color:var(--dim)}

.search{position:relative;margin-bottom:26px}
.search input{
  width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:12px 38px 12px 15px;font:inherit;font-size:14px;
}
.search input::placeholder{color:var(--dim)}
.search input::-webkit-search-cancel-button{display:none}  /* 커스텀 × 와 겹친다 */
.search input:focus{border-color:var(--accent);outline:none}
.search .x{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:none;background:none;color:var(--dim);font-size:16px;width:26px;height:26px;
  border-radius:7px;display:none;
}
.search .x.on{display:block}
.search .x:hover{background:var(--chip);color:var(--ink)}

.rail .k{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--dim);margin:0 0 10px}
.facet{display:flex;flex-direction:column;gap:1px;margin-bottom:26px}
.facet button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:none;color:var(--ink);
  padding:8px 11px;border-radius:9px;font-size:14px;
}
.facet button:hover{background:var(--chip)}
.facet button[aria-pressed="true"]{background:var(--accent);color:var(--onAccent);font-weight:700}
.facet button i{width:9px;height:9px;border-radius:3px;font-style:normal;flex:none}
.facet button b{margin-left:auto;font-weight:400;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.facet button[aria-pressed="true"] b{color:rgba(255,255,255,.72)}
:root[data-theme="dark"] .facet button[aria-pressed="true"] b{color:rgba(26,24,48,.66)}

.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);
  padding-top:18px;border-top:1px solid var(--line)}
.legend .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}

/* 우측 인덱스 — 카테고리 그룹이 컬럼을 타고 흐른다 */
/* 흘려보내지 않고 행을 맞춘다 — 한 줄의 그룹들은 같은 높이에서 나란히 시작하고,
   다음 줄은 그 줄에서 가장 긴 그룹 아래에서 다시 나란히 시작한다 */
.index{
  display:grid;grid-template-columns:repeat(3,1fr);
  column-gap:clamp(28px,4vw,64px);row-gap:0;
  align-items:start;
}

/* 그룹 높이 = 36(제목) + 18 + 36n(항목) + 54(아래) = 108 + 36n → 항상 --row 의 배수.
   덕분에 두 번째 줄도 36px 격자 위에서 시작한다 */
.group{margin:0 0 calc(var(--row) * 1.5)}
.group h2{
  margin:0 0 calc(var(--row) / 2);height:var(--row);
  font-size:19px;font-weight:700;letter-spacing:-.02em;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.group h2 i{width:9px;height:9px;border-radius:3px;font-style:normal}

/* 폭을 고정하고 가운데 정렬 — 컬럼이 넓어져도 세로줄은 그대로 */
.group ul{
  margin:0 auto;padding:0;list-style:none;
  width:100%;max-width:var(--colw);
}
.group li{margin:0}
.group a{
  display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);
  font-size:14px;height:var(--row);padding:0 10px;border-radius:8px;
}
.group a:hover{background:var(--chip);color:var(--accent)}
.group a .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.group a .dot.off{background:transparent;border:1.5px solid var(--line)}
.group a .nm{
  flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.group a em{
  font-style:normal;flex:none;width:34px;text-align:right;
  font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  opacity:0;transition:opacity .14s;
}
.group a:hover em{opacity:1}
/* 한글은 단어 중간이 걸리므로 패딩을 주면 글자가 벌어진다. 색으로만 강조한다 */
mark{background:none;color:var(--accent);font-weight:800}

.none{color:var(--dim);font-size:14px;line-height:1.8}
.none b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:12px;
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:1000;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:1180px){ .index{grid-template-columns:repeat(2,1fr)} }
@media(max-width:820px){
  .hdr nav{display:none}
  .wrap{grid-template-columns:1fr;gap:30px}
  .rail{position:static}
  .index{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){ .index{grid-template-columns:1fr} }
</style>
</head>
<body>

<header class="hdr">
  <span class="logo">MJC Club Archive</span>
  <nav>
    <a href="main.html">홈</a>
    <a href="#" class="on">둘러보기</a>
    <a href="#">동아리 개설</a>
  </nav>
  <div class="right">
    <button class="btn icon" id="theme" title="라이트/다크 전환" aria-label="테마 전환">◐</button>
    <button class="btn ghost sm">로그인</button>
    <button class="btn sm">회원가입</button>
  </div>
</header>

<div class="wrap">
  <aside class="rail">
    <h1>Archive</h1>
    <p class="sub" id="sub">32개 동아리 · 2026학년도 2학기</p>

    <div class="search">
      <input id="q" type="search" placeholder="동아리 이름으로 찾기" autocomplete="off">
      <button class="x" id="qx" aria-label="검색어 지우기">×</button>
    </div>

    <p class="k">분야</p>
    <div class="facet" id="cats"></div>

    <p class="k">모집</p>
    <div class="facet" id="recs">
      <button aria-pressed="true" data-r="all">전체 <b id="n-all"></b></button>
      <button aria-pressed="false" data-r="open">모집중 <b id="n-open"></b></button>
      <button aria-pressed="false" data-r="closed">모집마감 <b id="n-closed"></b></button>
    </div>

    <p class="legend"><span class="dot"></span> 지금 부원을 모집하는 동아리</p>
  </aside>

  <main class="index" id="index"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* 카테고리 순서 = 화면에 흐르는 순서 */
const CATS = [
  {nm:"학술·전공", v:"c1"},
  {nm:"공연·예술", v:"c2"},
  {nm:"체육",      v:"c3"},
  {nm:"봉사",      v:"c4"},
  {nm:"취미·교양", v:"c5"},
];

const CLUBS = [
  // 학술·전공 9
  ["메이커스","학술·전공",1,38],["TALK:","학술·전공",0,26],["알고리즘 연구회","학술·전공",1,21],
  ["회계연구회","학술·전공",1,17],["전기전자연구부","학술·전공",0,23],["건축모형연구회","학술·전공",1,14],
  ["디자인랩","학술·전공",1,28],["로보틱스","학술·전공",0,16],["세무회계 스터디","학술·전공",1,12],
  // 공연·예술 7
  ["사운드 오브 명지","공연·예술",1,41],["크루 리듬","공연·예술",1,35],["극예술연구회 무대","공연·예술",1,22],
  ["통기타 울림","공연·예술",0,18],["아카펠라 하모니","공연·예술",1,15],["재즈댄스부","공연·예술",0,20],
  ["뮤지컬부 커튼콜","공연·예술",1,26],
  // 체육 6
  ["FC 명지","체육",1,29],["농구부 리바운드","체육",1,24],["배드민턴부 셔틀","체육",1,31],
  ["검도부","체육",0,13],["볼링동아리 스트라이크","체육",1,19],["등산부 오름","체육",0,17],
  // 봉사 4
  ["한걸음","봉사",1,33],["헌혈봉사회 나눔","봉사",1,27],["환경지킴이 푸른","봉사",0,15],
  ["수어동아리 손말","봉사",1,11],
  // 취미·교양 6
  ["필름노트","취미·교양",0,24],["주사위","취미·교양",1,19],["커피동아리 드립","취미·교양",1,22],
  ["독서모임 책갈피","취미·교양",0,16],["요리연구회 한끼","취미·교양",1,25],["반려식물 초록","취미·교양",1,13],
].map(([nm,cat,rec,n])=>({nm,cat,rec,n}));

const $ = s=>document.querySelector(s);
let fCat = "전체", fRec = "all", q = "";

/* 좌측 분야 필터 */
$("#cats").innerHTML =
  `<button aria-pressed="true" data-c="전체">전체 <b>${CLUBS.length}</b></button>` +
  CATS.map(c=>{
    const n = CLUBS.filter(x=>x.cat===c.nm).length;
    return `<button aria-pressed="false" data-c="${c.nm}"><i style="background:var(--${c.v})"></i>${c.nm} <b>${n}</b></button>`;
  }).join("");

$("#n-all").textContent    = CLUBS.length;
$("#n-open").textContent   = CLUBS.filter(c=>c.rec).length;
$("#n-closed").textContent = CLUBS.filter(c=>!c.rec).length;

const esc = s => s.replace(/[&<>]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const hi = nm => q ? esc(nm).replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`,"gi"), "<mark>$1</mark>") : esc(nm);

function render(){
  const hit = CLUBS.filter(c=>
    (fCat === "전체" || c.cat === fCat) &&
    (fRec === "all" || (fRec === "open" ? c.rec : !c.rec)) &&
    (!q || c.nm.toLowerCase().includes(q.toLowerCase()))
  );

  $("#sub").textContent = (fCat==="전체" && fRec==="all" && !q)
    ? `${CLUBS.length}개 동아리 · 2026학년도 2학기`
    : `${hit.length}개 찾음`;

  if(!hit.length){
    $("#index").innerHTML =
      `<p class="none"><b>찾는 동아리가 없어요</b>검색어나 분야를 바꿔보세요.<br>
       원하는 동아리가 없다면 직접 개설할 수도 있습니다.</p>`;
    return;
  }

  // 카테고리 그룹을 순서대로 흘려보낸다. 그룹은 컬럼 중간에서 끊기지 않는다
  $("#index").innerHTML = CATS.map(cat=>{
    const list = hit.filter(c=>c.cat===cat.nm);
    if(!list.length) return "";
    return `<section class="group">
      <h2><i style="background:var(--${cat.v})"></i>${cat.nm}</h2>
      <ul>${list.map(c=>`
        <li><a href="#" data-nm="${esc(c.nm)}" title="${esc(c.nm)}">
          <span class="dot ${c.rec?"":"off"}"></span>
          <span class="nm">${hi(c.nm)}</span>
          <em>${c.n}명</em>
        </a></li>`).join("")}</ul>
    </section>`;
  }).join("");

  document.querySelectorAll(".group a").forEach(a=>a.onclick=e=>{
    e.preventDefault();
    toast(`${a.dataset.nm} 상세로 이동`);
  });
}

$("#cats").onclick = e=>{
  const b = e.target.closest("button"); if(!b) return;
  fCat = b.dataset.c;
  [...$("#cats").children].forEach(x=>x.setAttribute("aria-pressed", x===b));
  render();
};
$("#recs").onclick = e=>{
  const b = e.target.closest("button"); if(!b) return;
  fRec = b.dataset.r;
  [...$("#recs").children].forEach(x=>x.setAttribute("aria-pressed", x===b));
  render();
};
$("#q").oninput = e=>{
  q = e.target.value.trim();
  $("#qx").classList.toggle("on", !!q);
  render();
};
$("#qx").onclick = ()=>{ q=""; $("#q").value=""; $("#qx").classList.remove("on"); render(); $("#q").focus(); };

/* 테마 */
const root = document.documentElement;
root.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
$("#theme").onclick = ()=>{ root.dataset.theme = root.dataset.theme==="dark" ? "light" : "dark"; };

/* 토스트 */
let tT;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(tT); tT = setTimeout(()=>el.classList.remove("on"), 1800);
}

render();
</script>
</body>
</html>
