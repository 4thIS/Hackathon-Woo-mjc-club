[project]
name = "mjc-club-backend"
version = "0.1.0"
description = "MJC Club Archive — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "bcrypt>=4.2",
    "cryptography>=43.0",
    "httpx>=0.28",
    "pypdf>=5.1",
    "python-multipart>=0.0.17",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends()를 인자 기본값으로 쓰는 건 정상

[tool.pytest.ini_options]
pythonpath = ["."]
