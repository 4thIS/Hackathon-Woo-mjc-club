name: ci

on:
  pull_request:
  push:
    branches: [main]

# paths-filter 가 PR 변경 파일을 읽으려면 필요 — 없으면 "Resource not accessible" 로 실패
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          predicate-quantifier: every   # '!' 제외 패턴이 동작하려면 필요
          filters: |
            # 문서만 바뀐 PR 은 빌드를 태우지 않는다
            backend:
              - 'backend/**'
              - '!backend/**/*.md'
            frontend:
              - 'frontend/**'
              - '!frontend/**/*.md'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: club
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: setup
        working-directory: backend
        run: pip install uv && uv sync --frozen
      - name: lint
        working-directory: backend
        run: uv run ruff check .
      - name: test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/club
          SECRET_KEY: ci-only-secret
        run: uv run pytest -q

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: setup
        working-directory: frontend
        run: npm ci
      - name: build
        working-directory: frontend
        run: npm run build
